services:
  database:
    image: postgres:17
    container_name: expense_manager_db
    env_file: 
      - ".env"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: expense_manager_backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://expense_manager_db:5432/expense_manager
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - database

volumes:
  database_data:
